
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ปฏิทินวันทำงาน</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #333;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 15px;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    background: #333;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

.month {
    font-size: 22px;
    font-weight: bold;
}

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.weekday {
    text-align: center;
    font-weight: bold;
    padding: 10px 0;
}

.day {
    min-height: 80px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 7px;
    cursor: pointer;
    background: white;
}

.day:hover {
    background: #f0f0f0;
}

.day-number {
    font-weight: bold;
}

.status {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
}

.work {
    background: #e8f5e9;
    border: 2px solid #66bb6a;
}

.off {
    background: #ffebee;
    border: 2px solid #ef5350;
}

.leave {
    background: #fff8e1;
    border: 2px solid #ffca28;
}

.ot {
    background: #e3f2fd;
    border: 2px solid #42a5f5;
}

.summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.summary-box {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 10px;
}

.value {
    font-size: 20px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.pay-title {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.pay-period {
    text-align: center;
    font-size: 18px;
    margin: 10px 0;
}

.payday {
    text-align: center;
    font-size: 18px;
    margin-bottom: 15px;
}

.nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.nav-buttons button {
    flex: 1;
}

.net {
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
}

.insurance-info {
    margin-top: 15px;
    padding: 15px;
    background: #fff8e1;
    border-radius: 10px;
    line-height: 1.8;
}

.login-box {
    text-align: center;
    margin-bottom: 15px;
}

.user-info {
    text-align: center;
    margin-bottom: 10px;
    font-size: 14px;
}

#app {
    display: none;
}

@media(max-width:600px) {

    .container {
        padding: 8px;
    }

    .card {
        padding: 12px;
    }

    .day {
        min-height: 65px;
        font-size: 13px;
    }

    .status {
        font-size: 10px;
    }

    .month {
        font-size: 18px;
    }

    .pay-title {
        font-size: 19px;
    }

}

</style>
</head>

<body>

<div class="login-box">

</div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCixSYpEEl4oDZG2hGrTOXv51OkfGJD_Xk",

    authDomain:
        "workcalendar-75997.firebaseapp.com",

    projectId:
        "workcalendar-75997",

    storageBucket:
        "workcalendar-75997.firebasestorage.app",

    messagingSenderId:
        "10110694468",

    appId:
        "1:10110694468:web:3b1ccb9c35fad5f6517811",

    measurementId:
        "G-QZCBWQ2JSS"

};


const appFirebase =
    initializeApp(firebaseConfig);

const auth =
    getAuth(appFirebase);

const db =
    getFirestore(appFirebase);

const provider =
    new GoogleAuthProvider();


let currentUser = null;


/* =====================================================
   ตัวแปรระบบ
===================================================== */

let currentDate = new Date();

let data = {};

let settings = {

    dailyRate: 550,

    insuranceTotal: 6000,

    workInsurance: 150,

    socialSecurity: 83

};


let selectedPeriodIndex = 0;


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginBtn")
.addEventListener("click", async function() {

    try {

        await signInWithPopup(
            auth,
            provider
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "เข้าสู่ระบบไม่สำเร็จ\n\n"
            + error.code
        );

    }

});


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener("click", async function() {

    await signOut(auth);

});


/* =====================================================
   PATH FIRESTORE
===================================================== */

function userDoc(path) {

    return doc(
        db,
        "users",
        currentUser.uid,
        ...path.split("/")
    );

}


/* =====================================================
   โหลดข้อมูลจาก FIRESTORE
===================================================== */

async function loadCloudData() {

    try {

        const calendarSnap =
            await getDoc(
                userDoc("calendar/data")
            );

        if (calendarSnap.exists()) {

            data =
                calendarSnap.data().data || {};

        }

        const settingsSnap =
            await getDoc(
                userDoc("settings/config")
            );

        if (settingsSnap.exists()) {

            settings =
                {
                    ...settings,
                    ...settingsSnap.data().settings
                };

        }

        loadSettings();

        renderCalendar();

        updatePayPeriod();

    }

    catch(error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        alert(
            "โหลดข้อมูลไม่สำเร็จ\n\n"
            + error.code
        );

    }

}


/* =====================================================
   บันทึกข้อมูลลง FIRESTORE
===================================================== */

async function saveData() {

    if (!currentUser) {

        return;

    }

    try {

        await setDoc(

            userDoc("calendar/data"),

            {
                data: data
            },

            {
                merge: true
            }

        );

        console.log(
            "บันทึกข้อมูลปฏิทินสำเร็จ"
        );

    }

    catch(error) {

        console.error(
            "SAVE ERROR:",
            error
        );

        alert(
            "บันทึกข้อมูลไม่สำเร็จ\n\n"
            + error.code
        );

    }

}


/* =====================================================
   บันทึก SETTINGS
===================================================== */

async function saveSettings() {

    settings.dailyRate =
        Number(
            document
            .getElementById("dailyRate")
            .value
        );

    settings.insuranceTotal =
        Number(
            document
            .getElementById("insuranceTotal")
            .value
        );

    settings.workInsurance =
        Number(
            document
            .getElementById("workInsurance")
            .value
        );

    settings.socialSecurity =
        Number(
            document
            .getElementById("socialSecurity")
            .value
        );


    if (!currentUser) {

        return;

    }


    try {

        await setDoc(

            userDoc("settings/config"),

            {
                settings: settings
            },

            {
                merge: true
            }

        );

    }

    catch(error) {

        console.error(
            "SETTING SAVE ERROR:",
            error
        );

    }

}


/* =====================================================
   LOAD SETTINGS
===================================================== */

function loadSettings() {

    document
    .getElementById("dailyRate")
    .value =
        settings.dailyRate;

    document
    .getElementById("insuranceTotal")
    .value =
        settings.insuranceTotal;

    document
    .getElementById("workInsurance")
    .value =
        settings.workInsurance;

    document
    .getElementById("socialSecurity")
    .value =
        settings.socialSecurity;

}


/* =====================================================
   รอบเงิน
===================================================== */

function getPeriodFromDate(date) {

    let d = new Date(date);

    let day = d.getDate();

    let year = d.getFullYear();

    let month = d.getMonth();


    if (day >= 29) {

        return {

            start:
                new Date(
                    year,
                    month,
                    29
                ),

            end:
                new Date(
                    year,
                    month + 1,
                    5
                )

        };

    }


    if (day <= 5) {

        return {

            start:
                new Date(
                    year,
                    month - 1,
                    29
                ),

            end:
                new Date(
                    year,
                    month,
                    5
                )

        };

    }


    if (day >= 6 && day <= 7) {

        return {

            start:
                new Date(
                    year,
                    month,
                    6
                ),

            end:
                new Date(
                    year,
                    month,
                    12
                )

        };

    }


    if (day >= 8 && day <= 14) {

        return {

            start:
                new Date(
                    year,
                    month,
                    8
                ),

            end:
                new Date(
                    year,
                    month,
                    14
                )

        };

    }


    if (day >= 15 && day <= 21) {

        return {

            start:
                new Date(
                    year,
                    month,
                    15
                ),

            end:
                new Date(
                    year,
                    month,
                    21
                )

        };

    }


    if (day >= 22 && day <= 28) {

        return {

            start:
                new Date(
                    year,
                    month,
                    22
                ),

            end:
                new Date(
                    year,
                    month,
                    28
                )

        };

    }


    return {

        start:
            new Date(
                year,
                month,
                13
            ),

        end:
            new Date(
                year,
                month,
                19
            )

    };

}


/* =====================================================
   วันเงินออก
===================================================== */

function getPayday(endDate) {

    let payday =
        new Date(endDate);

    payday.setDate(
        payday.getDate() + 7
    );

    return payday;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date) {

    return date.getDate()
        + "/"
        + (date.getMonth() + 1)
        + "/"
        + (date.getFullYear() + 543);

}


/* =====================================================
   KEY
===================================================== */

function getKey(date) {

    return date.getFullYear()
        + "-"
        + (date.getMonth() + 1)
        + "-"
        + date.getDate();

}


/* =====================================================
   MOVE PERIOD
===================================================== */

function movePeriod(
    period,
    direction
) {

    let newDate =
        new Date(period.start);

    newDate.setDate(
        newDate.getDate()
        + (direction * 7)
    );

    return getPeriodFromDate(
        newDate
    );

}


/* =====================================================
   PAID INSURANCE
===================================================== */

function getPaidInsurancePeriods() {

    const today =
        new Date();

    today.setHours(
        0, 0, 0, 0
    );


    let currentPeriod =
        getPeriodFromDate(today);


    let count = 0;


    let period =
        new Date(
            currentPeriod.start
        );


    for (
        let i = 0;
        i < 200;
        i++
    ) {

        let p =
            getPeriodFromDate(
                period
            );


        let payday =
            getPayday(
                p.end
            );


        payday.setHours(
            0, 0, 0, 0
        );


        if (
            payday <= today
        ) {

            count++;

        }


        period.setDate(
            period.getDate() - 7
        );

    }


    return count;

}


/* =====================================================
   RENDER CALENDAR
===================================================== */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );

    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const firstDay =
        new Date(
            year,
            month,
            1
        );


    const lastDay =
        new Date(
            year,
            month + 1,
            0
        );


    const startDay =
        (
            firstDay.getDay()
            + 6
        ) % 7;


    const daysInMonth =
        lastDay.getDate();


    const months = [

        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"

    ];


    document
    .getElementById(
        "monthYear"
    )
    .innerText =

        months[month]
        + " "
        + (year + 543);


    for (
        let i = 0;
        i < startDay;
        i++
    ) {

        calendar.appendChild(
            document.createElement(
                "div"
            )
        );

    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const key =
            year
            + "-"
            + (month + 1)
            + "-"
            + day;


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day";


        const status =
            data[key];


        if (status === 0)
            cell.classList.add(
                "work"
            );

        if (status === 1)
            cell.classList.add(
                "off"
            );

        if (status === 2)
            cell.classList.add(
                "leave"
            );

        if (status === 3)
            cell.classList.add(
                "ot"
            );


        let text = "";


        if (status === 0)
            text = "✓ ทำงาน";

        if (status === 1)
            text = "✕ หยุด";

        if (status === 2)
            text = "ลา";

        if (status === 3)
            text = "OT";


        cell.innerHTML =

            `<div class="day-number">
                ${day}
            </div>

            <div class="status">
                ${text}
            </div>`;


        cell.onclick =
            async function() {

                if (
                    data[key]
                    === undefined
                ) {

                    data[key] = 0;

                }

                else {

                    data[key]++;

                    if (
                        data[key] > 3
                    ) {

                        delete data[key];

                    }

                }


                renderCalendar();

                updatePayPeriod();

                await saveData();

            };


        calendar.appendChild(
            cell
        );

    }

}


/* =====================================================
   UPDATE PAY PERIOD
===================================================== */

function updatePayPeriod() {

    let baseDate =
        new Date(
            currentDate
        );


    let period =
        getPeriodFromDate(
            baseDate
        );


    for (
        let i = 0;
        i < Math.abs(
            selectedPeriodIndex
        );
        i++
    ) {

        period =
            movePeriod(

                period,

                selectedPeriodIndex > 0
                    ? 1
                    : -1

            );

    }


    const payday =
        getPayday(
            period.end
        );


    let workCount = 0;

    let leaveCount = 0;

    let otCount = 0;


    let date =
        new Date(
            period.start
        );


    while (
        date <= period.end
    ) {

        const key =
            getKey(date);


        if (
            data[key] === 0
        )
            workCount++;


        if (
            data[key] === 2
        )
            leaveCount++;


        if (
            data[key] === 3
        )
            otCount++;


        date.setDate(
            date.getDate() + 1
        );

    }


    const salary =
        workCount
        * settings.dailyRate;


    const paidPeriods =
        getPaidInsurancePeriods();


    const alreadyPaid =
        Math.min(

            settings.insuranceTotal,

            paidPeriods
            * settings.workInsurance

        );


    const remaining =
        Math.max(

            0,

            settings.insuranceTotal
            - alreadyPaid

        );


    let insuranceDeduct = 0;


    const today =
        new Date();

    today.setHours(
        0, 0, 0, 0
    );


    const paydayCheck =
        new Date(payday);

    paydayCheck.setHours(
        0, 0, 0, 0
    );


    if (

        paydayCheck <= today

        &&

        workCount > 0

        &&

        remaining > 0

    ) {

        insuranceDeduct =
            Math.min(

                settings.workInsurance,

                remaining

            );

    }


    const social =
        workCount > 0
            ? settings.socialSecurity
            : 0;


    const net =
        salary
        - insuranceDeduct
        - social;


    document
    .getElementById(
        "payPeriod"
    )
    .innerHTML =

        "📅 รอบวันที่ <b>"
        + formatDate(
            period.start
        )
        + " – "
        + formatDate(
            period.end
        )
        + "</b>";


    document
    .getElementById(
        "payday"
    )
    .innerHTML =

        "💵 เงินออกวันที่ <b>"
        + formatDate(
            payday
        )
        + "</b>";


    document
    .getElementById(
        "workCount"
    )
    .innerText =
        workCount;


    document
    .getElementById(
        "leaveCount"
    )
    .innerText =
        leaveCount;


    document
    .getElementById(
        "otCount"
    )
    .innerText =
        otCount;


    document
    .getElementById(
        "salary"
    )
    .innerText =
        salary.toLocaleString();


    document
    .getElementById(
        "insurance"
    )
    .innerText =
        "-"
        + insuranceDeduct.toLocaleString();


    document
    .getElementById(
        "social"
    )
    .innerText =
        "-"
        + social.toLocaleString();


    document
    .getElementById(
        "netSalary"
    )
    .innerText =
        net.toLocaleString();


    document
    .getElementById(
        "insurancePaidDisplay"
    )
    .innerText =
        alreadyPaid.toLocaleString();


    document
    .getElementById(
        "insuranceRemainingDisplay"
    )
    .innerText =
        remaining.toLocaleString();


    document
    .getElementById(
        "insurancePeriodDisplay"
    )
    .innerText =
        settings.workInsurance > 0
            ? Math.floor(
                alreadyPaid
                / settings.workInsurance
            )
            : 0;

}


/* =====================================================
   CHANGE PERIOD
===================================================== */

window.changePeriod =
function(direction) {

    selectedPeriodIndex +=
        direction;

    updatePayPeriod();

};


/* =====================================================
   CHANGE MONTH
===================================================== */

window.changeMonth =
function(amount) {

    currentDate.setMonth(
        currentDate.getMonth()
        + amount
    );


    selectedPeriodIndex = 0;


    renderCalendar();

    updatePayPeriod();

};


/* =====================================================
   SETTINGS EVENT
===================================================== */

document
.getElementById("dailyRate")
.addEventListener(
    "input",
    async function() {

        await saveSettings();

        updatePayPeriod();

    }
);

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async function(user) {

        currentUser = user;


        if (user) {

            document
            .getElementById(
                "loginBtn"
            )
            .style.display =
                "none";


            document
            .getElementById(
                "logoutBtn"
            )
            .style.display =
                "inline-block";


            document
            .getElementById(
                "userInfo"
            )
            .innerText =
                "👤 "
                + (
                    user.displayName
                    || user.email
                );


            document
            .getElementById(
                "app"
            )
            .style.display =
                "block";


            await loadCloudData();

        }

        else {

            document
            .getElementById(
                "loginBtn"
            )
            .style.display =
                "inline-block";


            document
            .getElementById(
                "logoutBtn"
            )
            .style.display =
                "none";


            document
            .getElementById(
                "userInfo"
            )
            .innerText = "";


            document
            .getElementById(
                "app"
            )
            .style.display =
                "none";

        }

    }
);

</script>
